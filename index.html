<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>🚐 Summer 2026 Road Trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #08100e;
  --card: #101a16;
  --card2: #182620;
  --border: #243c2c;
  --accent: #e8782a;
  --accent2: #f5a823;
  --text: #f0ede6;
  --muted: #8a9e82;
  --green: #52b87a;
  --red: #e85c45;
  --blue: #5b9ee0;
  --purple: #a07bd6;
  --orange: #e86a1a;
  --teal: #3abcaa;
  --radius: 14px;
  --nav-h: 68px;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;700;800;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; height: 100dvh; width: 100%; overflow: hidden; }
#header { background: linear-gradient(180deg, #0e1628 0%, #131c2e 100%); border-bottom: 1px solid var(--border); padding: max(14px, env(safe-area-inset-top)) 16px 12px; padding-top: calc(max(14px, env(safe-area-inset-top)) + 0px); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
#header-left h1 { font-size: 1rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }
#header-left .sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
#progress-wrap { width: 80px; }
#progress-label { font-size: 0.62rem; color: var(--muted); text-align: right; margin-bottom: 3px; }
#progress-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
#progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.5s ease; }
#content { flex: 1; overflow: hidden; position: relative; }
.tab-pane { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 14px 90px; display: none; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.tab-pane.active { display: block; }
#nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(8,16,14,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid #2a5a3a; box-shadow: 0 -4px 30px rgba(58,188,170,0.08); display: flex; z-index: 100; padding-bottom: max(env(safe-area-inset-bottom), 6px); }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 0.63rem; font-weight: 600; color: var(--muted); cursor: pointer; padding: 10px 4px 8px; transition: all 0.15s; border: none; background: none; letter-spacing: 0.02em; }
.nav-btn.active { color: var(--accent); text-shadow: 0 0 10px rgba(232,120,42,0.5); }
.nav-btn .icon { font-size: 1.35rem; line-height: 1; }
.nav-btn.active .icon { transform: scale(1.1); }

/* ── PILLS / BADGES ── */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; }
.pill-green { background: #0a2e20; color: var(--green); border: 1px solid #0d3d29; }
.pill-amber { background: #2d1a00; color: var(--accent); border: 1px solid #3d2200; }
.pill-red { background: #2d0a0a; color: var(--red); border: 1px solid #3d1010; }
.pill-blue { background: #0a1e3d; color: var(--blue); border: 1px solid #0d2850; }
.pill-purple { background: #1a0a3d; color: var(--purple); border: 1px solid #220d50; }
.pill-teal { background: #0a2d2d; color: var(--teal); border: 1px solid #0d3d3d; }

/* ── DAY NAVIGATOR ── */
.day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
.day-nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.day-nav-btn:active { background: var(--card2); transform: scale(0.97); }
.day-nav-center { text-align: center; flex: 1; }
.day-nav-date { font-size: 0.78rem; color: var(--muted); }
.day-nav-num { font-size: 0.88rem; font-weight: 800; color: var(--accent); margin-top: 2px; text-shadow: 0 0 12px rgba(232,120,42,0.6); }

/* ── HERO BANNER ── */
.hero-banner { border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; position: relative; }
.hero-gradient { padding: 20px 18px 16px; position: relative; }
.hero-gradient::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.4) 100%); } .hero-gradient::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, rgba(245,200,80,0.12) 0%, transparent 60%); z-index: 0; }
.hero-content { position: relative; z-index: 1; }
.hero-emoji { font-size: 3.2rem; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 0 16px rgba(245,168,35,0.5)) drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
.hero-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; margin-bottom: 4px; }
.hero-title { font-size: 1.4rem; font-weight: 900; line-height: 1.2; letter-spacing: -0.02em; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.hero-leg { font-size: 0.82rem; opacity: 0.75; margin-top: 4px; }
.hero-stats-row { display: flex; gap: 0; margin-top: 14px; background: rgba(0,0,0,0.25); border-radius: 10px; overflow: hidden; }
.hero-stat { flex: 1; padding: 8px 12px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
.hero-stat:last-child { border-right: none; }
.hero-stat-val { font-size: 0.95rem; font-weight: 800; }
.hero-stat-lbl { font-size: 0.6rem; opacity: 0.65; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.05em; }

/* ── WARNING BANNER ── */
.warn-banner { background: linear-gradient(135deg, #1e0808, #2d0e10); border: 1px solid #7f1d1d; border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start; }
.warn-banner .icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
.warn-text { font-size: 0.8rem; line-height: 1.55; color: #fecaca; }

/* ── TIMELINE ── */
.timeline { position: relative; padding-left: 4px; }
.timeline-section-header { font-size: 0.63rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 16px 0 8px 46px; }
.timeline-item { display: flex; gap: 0; margin-bottom: 6px; position: relative; }
.timeline-left { display: flex; flex-direction: column; align-items: center; width: 42px; flex-shrink: 0; }
.timeline-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; z-index: 1; border: 2px solid rgba(255,255,255,0.08); }
.timeline-line { width: 2px; background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%); flex: 1; min-height: 8px; margin-top: 2px; }
.timeline-right { flex: 1; background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 0; border: 1px solid var(--border); margin-left: 6px; }
.timeline-right:hover { border-color: rgba(255,255,255,0.12); }
.tl-name { font-size: 0.88rem; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
.tl-note { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
.td-fuel { background: #0d1e3d; border-color: #1e3a6e; }
.td-fuel .timeline-dot { background: #1a3260; }
.td-stop { background: #1e1208; border-color: #4a2e10; }
.td-stop .timeline-dot { background: #3b2010; }
.td-lunch { background: #0a1e12; border-color: #1a4a28; }
.td-lunch .timeline-dot { background: #0d3018; }
.td-spring { background: #0a1e1e; border-color: #1a4a4a; }
.td-spring .timeline-dot { background: #0d3030; }
.td-grocery { background: #0d0d2e; border-color: #1e1e5a; }
.td-grocery .timeline-dot { background: #151538; }
.td-warn { background: #2d0a0a; border-color: #7f1d1d; }
.td-warn .timeline-dot { background: #450a0a; }
.td-camp { background: #0a1e10; border-color: #166534; }
.td-camp .timeline-dot { background: #0d3018; }

/* ── CAMP CARD ── */
.camp-card { background: linear-gradient(135deg, #0a2018, #0d2c1a); border: 1px solid #2a6040; box-shadow: 0 0 20px rgba(42,160,90,0.1), inset 0 1px 0 rgba(255,255,255,0.04); border-radius: var(--radius); overflow: hidden; margin: 14px 0 0; }
.camp-card-header { padding: 14px 16px 12px; border-bottom: 1px solid rgba(22,101,52,0.4); display: flex; align-items: center; gap: 10px; }
.camp-card-icon { font-size: 1.6rem; }
.camp-card-title { font-size: 1rem; font-weight: 800; color: #86efac; line-height: 1.2; }
.camp-card-sub { font-size: 0.73rem; color: #4ade80; opacity: 0.8; margin-top: 2px; }
.camp-rows { padding: 10px 16px 14px; }
.camp-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; padding: 5px 0; border-bottom: 1px solid rgba(22,101,52,0.25); }
.camp-row:last-child { border-bottom: none; }
.camp-label { color: #4ade80; opacity: 0.7; }
.camp-value { font-weight: 600; text-align: right; color: var(--text); }
.conf-num { font-family: 'SF Mono', 'Consolas', monospace; color: var(--accent); font-size: 0.82rem; letter-spacing: 0.06em; }

/* ── HIKE CARDS ── */
.hikes-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.hike-card { background: linear-gradient(135deg, #1a0d3d, #150d2e); border: 1px solid #2e1065; border-radius: 11px; padding: 10px 13px; display: flex; gap: 10px; align-items: flex-start; transition: opacity 0.2s; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hike-card.done { opacity: 0.5; background: linear-gradient(135deg,#0e1e10,#0a180c); border-color: #2a5c2a; }
.hike-card-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #4a2a8a; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; transition: all 0.2s; background: rgba(255,255,255,0.04); }
.hike-card.done .hike-card-check { background: #2a7a3a; border-color: #3a9a4a; }
.hike-card-check-icon { font-size: 0.8rem; opacity: 0; transition: opacity 0.15s; }
.hike-card.done .hike-card-check-icon { opacity: 1; }
.hike-card-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
.hike-card-body { flex: 1; }
.hike-card-name { font-size: 0.87rem; font-weight: 700; color: #c4b5fd; margin-bottom: 3px; transition: text-decoration 0.2s; }
.hike-card.done .hike-card-name { text-decoration: line-through; color: var(--muted); }
.hike-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.hike-meta-badge { font-size: 0.63rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,0.07); color: var(--muted); border: 1px solid rgba(255,255,255,0.08); }
.hike-card-note { font-size: 0.73rem; color: var(--muted); line-height: 1.5; }

/* ── ALL DAYS ── */
.trip-progress-strip { background: var(--card); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--border); }
.tps-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.tps-bar { height: 6px; background: var(--border); border-radius: 6px; overflow: hidden; }
.tps-fill { height: 100%; background: linear-gradient(90deg, #3abcaa, #52b87a, #e8782a, #f5a823); border-radius: 6px; box-shadow: 0 0 8px rgba(232,120,42,0.4); }
.tps-stats { display: flex; justify-content: space-between; margin-top: 8px; }
.tps-stat { font-size: 0.7rem; color: var(--muted); }
.tps-stat span { color: var(--text); font-weight: 700; }

.day-card { border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); transition: border-color 0.15s; }
.day-card:active { transform: scale(0.99); }
.day-card-strip { height: 3px; }
.day-card-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; background: var(--card); }
.day-card-left .dc-date { font-size: 0.67rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.day-card-left .dc-dest { font-size: 0.96rem; font-weight: 800; margin: 3px 0 2px; letter-spacing: -0.01em; }
.day-card-left .dc-summary { font-size: 0.72rem; color: var(--muted); }
.day-card-right { text-align: right; flex-shrink: 0; padding-left: 8px; }
.day-card-right .dc-miles { font-size: 0.88rem; font-weight: 800; color: var(--accent); }
.day-card-right .dc-time { font-size: 0.67rem; color: var(--muted); margin-top: 2px; }
.day-card-emoji { font-size: 1.5rem; margin-right: 6px; filter: drop-shadow(0 0 6px rgba(245,168,35,0.4)); }
.day-card-detail { display: none; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--card); }
.day-card-detail.open { display: block; }
.detail-section { margin-top: 10px; }
.detail-section h4 { font-size: 0.62rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.detail-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; font-size: 0.78rem; }
.detail-row .icon { flex-shrink: 0; line-height: 1.6; }
.detail-row .txt { line-height: 1.45; }
.detail-row .sub { color: var(--muted); font-size: 0.7rem; margin-top: 1px; }

/* ── MAP ── */
#map { width: 100%; height: 100%; }
.map-pane { padding: 0 !important; }

/* ── QUICK REF ── */
.ref-section { margin-bottom: 18px; }
.ref-section h3 { font-size: 0.75rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; padding-left: 10px; border-left: 3px solid var(--accent); display: flex; align-items: center; gap: 6px; }
.ref-state-header { font-size: 0.65rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 12px 0 6px; padding-left: 2px; }
.ref-item { background: var(--card); border-radius: 11px; padding: 11px 13px; margin-bottom: 5px; border: 1px solid var(--border); }
.ref-name { font-size: 0.86rem; font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ref-addr { font-size: 0.71rem; color: var(--muted); margin-bottom: 3px; }
.ref-note { font-size: 0.71rem; color: var(--muted); line-height: 1.4; }
.ref-item.critical { border-color: #7f1d1d; background: linear-gradient(135deg, #1a0a0a, #220d0d); }

/* ── SECTION LABEL ── */
.section-label { font-size: 0.63rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 16px 0 8px; }

/* ── MISC ── */
.countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 20px; }
.countdown-num { font-size: 5rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
.countdown-label { font-size: 0.9rem; color: var(--muted); margin-top: 8px; }
.countdown-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; opacity: 0.7; }

/* Leaflet popup override */
.leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { font-size: 0.82rem; line-height: 1.55; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-left">
      <h1 onclick="goHome()" style="cursor:pointer;-webkit-tap-highlight-color:rgba(232,120,42,0.2);padding:4px 0;">🚐 Summer 2026</h1>
      <div class="sub" id="header-sub">Jun 14 – Jul 12 · 29 Days</div>
    </div>
    <div id="progress-wrap">
      <div id="progress-label">0 / 29</div>
      <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div id="content">
    <div class="tab-pane active" id="pane-today"></div>
    <div class="tab-pane" id="pane-days"></div>
    <div class="tab-pane map-pane" id="pane-map"><div id="map"></div></div>
    <div class="tab-pane" id="pane-ref"></div>
  </div>
  <nav id="nav">
    <button class="nav-btn active" onclick="showTab('today',this)"><span class="icon">🗓️</span>Today</button>
    <button class="nav-btn" onclick="showTab('days',this)"><span class="icon">📅</span>All Days</button>
    <button class="nav-btn" onclick="showTab('map',this)"><span class="icon">🗺️</span>Map</button>
    <button class="nav-btn" onclick="showTab('ref',this)"><span class="icon">⚡</span>Quick Ref</button>
  </nav>
</div>

<script>

let currentDayIdx = 0;
let mapInit = false;

function getTodayIdx() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(TRIP_START); start.setHours(0,0,0,0);
  const end = new Date(TRIP_END); end.setHours(0,0,0,0);
  if (today < start) return -1;
  if (today > end) return -2;
  for (let i = 0; i < DAYS.length; i++) {
    const d = new Date(DAYS[i].date); d.setHours(0,0,0,0);
    if (d.getTime() === today.getTime()) return i;
  }
  // find nearest
  for (let i = 0; i < DAYS.length - 1; i++) {
    const a = new Date(DAYS[i].date), b = new Date(DAYS[i+1].date);
    if (today >= a && today < b) return i;
  }
  return DAYS.length - 1;
}

function daysUntilTrip() {
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(TRIP_START); start.setHours(0,0,0,0);
  return Math.round((start - today) / 86400000);
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}

function getTheme(d) {
  for (const [k,v] of Object.entries(THEMES)) {
    if (d.to.includes(k) || d.from.includes(k) || d.label.includes(k)) return v;
  }
  return ['linear-gradient(135deg,#1e293b,#334155)','#e2e8f0','🚐'];
}

function fuelBadge(type) {
  if (type === 'R99') return '<span class="pill pill-green">♻️ R99</span>';
  if (type === 'ULSD') return '<span class="pill pill-blue">⛽ ULSD</span>';
  return '<span class="pill pill-amber">⚠️</span>';
}

function updateProgress(idx) {
  const todayIdx = getTodayIdx();
  const pct = todayIdx < 0 ? 0 : Math.min(100, Math.round((todayIdx / 28) * 100));
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = todayIdx < 0 ? '0 / 29' : `${todayIdx + 1} / 29`;
}

function renderToday() {
  const pane = document.getElementById('pane-today');
  const d = DAYS[currentDayIdx];
  const todayIdx = getTodayIdx();
  const isDriveDay = d.miles !== '0';
  const [grad, textCol, emoji] = getTheme(d);

  // Header subtitle
  if (todayIdx === -1) {
    document.getElementById('header-sub').textContent = `Starts in ${daysUntilTrip()} days · Jun 14`;
  } else if (todayIdx === -2) {
    document.getElementById('header-sub').textContent = 'Trip complete! 🎉';
  } else {
    document.getElementById('header-sub').textContent = `Day ${todayIdx + 1} of 29 · ${formatDate(DAYS[todayIdx].date)}`;
  }
  updateProgress();

  let html = '';

  // Pre-trip countdown
  if (todayIdx === -1 && currentDayIdx === 0) {
    html += `<div class="countdown-screen">
      <div class="countdown-num">${daysUntilTrip()}</div>
      <div class="countdown-label">days until departure</div>
      <div class="countdown-sub">Jun 14, 2026 · Fairfax → June Lake</div>
    </div>`;
  }

  // Day navigator
  html += `<div class="day-nav">
    <button class="day-nav-btn" onclick="prevDay()">← Prev</button>
    <div class="day-nav-center">
      <div class="day-nav-date">${formatDate(d.date)}</div>
      <div class="day-nav-num">Day ${d.day} of 29</div>
    </div>
    <button class="day-nav-btn" onclick="nextDay()">Next →</button>
  </div>`;

  // Hero banner
  html += `<div class="hero-banner">
    <div class="hero-gradient" style="background:${grad}">
      <div class="hero-content">
        <div class="hero-emoji">${emoji}</div>
        <div class="hero-label" style="color:${textCol}">Day ${d.day} · ${isDriveDay ? 'Drive Day' : 'Rest Day'}</div>
        <div class="hero-title" style="color:${textCol}">${d.label}</div>
        <div class="hero-leg" style="color:${textCol}">${d.from} → ${d.to}</div>
        <div class="hero-stats-row">
          ${isDriveDay ? `<div class="hero-stat"><div class="hero-stat-val" style="color:${textCol}">${d.miles}</div><div class="hero-stat-lbl" style="color:${textCol}">miles</div></div>
          <div class="hero-stat"><div class="hero-stat-val" style="color:${textCol}">${d.time}</div><div class="hero-stat-lbl" style="color:${textCol}">drive</div></div>` :
          `<div class="hero-stat"><div class="hero-stat-val" style="color:${textCol}">Rest</div><div class="hero-stat-lbl" style="color:${textCol}">day</div></div>`}
          ${d.nights > 0 ? `<div class="hero-stat"><div class="hero-stat-val" style="color:${textCol}">${d.nights}n</div><div class="hero-stat-lbl" style="color:${textCol}">tonight</div></div>` : ''}
          <div class="hero-stat"><div class="hero-stat-val" style="color:${textCol}">${d.camp.type === 'NPS' ? '🏕️ NPS' : d.camp.type === 'HipCamp' ? '🦙 Hip' : d.camp.type === 'Hotel' || d.camp.type === 'Hotel/Lodge' ? '🏨 Hotel' : d.camp.type === 'Family' ? '🏡 Fam' : '⛺ Camp'}</div><div class="hero-stat-lbl" style="color:${textCol}">stay type</div></div>
        </div>
      </div>
    </div>
  </div>`;

  // Shaka Guide button(s)
  const shakas = [d.shaka, d.shakab, d.shakac].filter(Boolean);
  shakas.forEach(sg => {
    const isOptional = !!sg.optional;
    const borderColor = isOptional ? '#5a3f1a' : '#3b1f8a';
    const bgGrad = isOptional ? 'linear-gradient(135deg,#2d1a0a,#1a1008)' : 'linear-gradient(135deg,#1a0d3d,#0d1e3d)';
    const nameColor = isOptional ? '#fbbf24' : '#c4b5fd';
    const prefix = isOptional ? '🗺️ Optional Detour · ' : '';
    const suffix = sg.optional ? ` <span style="color:#f59e0b;font-size:0.68rem;font-weight:700;">${sg.optional}</span>` : '';
    html += `<a href="${sg.url}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;background:${bgGrad};border:1px solid ${borderColor};border-radius:12px;padding:12px 14px;margin-bottom:6px;text-decoration:none;color:var(--text);">
      <span style="font-size:1.5rem">🎧</span>
      <div style="flex:1">
        <div style="font-size:0.78rem;font-weight:800;color:${nameColor};">${prefix}${sg.name}</div>
        <div style="font-size:0.7rem;color:var(--muted);margin-top:2px;">Shaka Guide Audio Tour · Tap to open${suffix}</div>
      </div>
      <span style="font-size:0.8rem;color:${nameColor};">→</span>
    </a>`;
  });
  if (shakas.length) html += '<div style="margin-bottom:4px"></div>';

  // Reminders
  d.reminders.forEach(r => {
    html += `<div class="warn-banner"><div class="icon">⚠️</div><div class="warn-text">${r}</div></div>`;
  });

  // Timeline
  const hasTimeline = isDriveDay && (d.fuel.length > 0 || d.stops.length > 0 || d.grocery || d.hotspring || d.lunch);
  if (hasTimeline) {
    html += `<div class="timeline">`;
    html += `<div class="timeline-section-header">Drive Plan</div>`;

    // Fuel stops
    d.fuel.forEach(f => {
      const isWarn = f.name.startsWith('⚠️') || f.note.startsWith('⚠️');
      html += `<div class="timeline-item">
        <div class="timeline-left">
          <div class="timeline-dot ${isWarn ? 'td-warn' : 'td-fuel'}">⛽</div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-right ${isWarn ? 'td-warn' : 'td-fuel'}">
          <div class="tl-name">${f.name.replace('⚠️ ','')}&nbsp;${fuelBadge(f.type)}</div>
          <div class="tl-note">${f.note}</div>
        </div>
      </div>`;
    });

    // Grocery
    if (d.grocery) {
      html += `<div class="timeline-item">
        <div class="timeline-left">
          <div class="timeline-dot td-grocery">🛒</div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-right td-grocery">
          <div class="tl-name">${d.grocery.name}</div>
          <div class="tl-note">${d.grocery.note}</div>
        </div>
      </div>`;
    }

    // Drive stops
    d.stops.forEach(s => {
      html += `<div class="timeline-item">
        <div class="timeline-left">
          <div class="timeline-dot td-stop">${s.priority === 'top' ? '🌟' : '📍'}</div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-right td-stop">
          <div class="tl-name">${s.name}</div>
          <div class="tl-note">${s.note}</div>
        </div>
      </div>`;
    });

    // Lunch
    if (d.lunch) {
      html += `<div class="timeline-item">
        <div class="timeline-left">
          <div class="timeline-dot td-lunch">🥪</div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-right td-lunch">
          <div class="tl-name">${d.lunch.name}</div>
          <div class="tl-note">${d.lunch.loc} — ${d.lunch.note}</div>
        </div>
      </div>`;
    }

    // Hot spring
    if (d.hotspring) {
      html += `<div class="timeline-item">
        <div class="timeline-left">
          <div class="timeline-dot td-spring">♨️</div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-right td-spring">
          <div class="tl-name">${d.hotspring.name}</div>
          <div class="tl-note">${d.hotspring.loc} — ${d.hotspring.note}</div>
        </div>
      </div>`;
    }

    // Quirky stops
    if (d.quirky) {
      d.quirky.forEach(q => {
        html += `<div class="timeline-item">
          <div class="timeline-left">
            <div class="timeline-dot" style="background:#3b1f5e">🎪</div>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-right" style="background:#1a0d3d;border-color:#3b1f6e">
            <div class="tl-name" style="color:#c4b5fd">${q.name}</div>
            <div class="tl-note">${q.note}</div>
          </div>
        </div>`;
      });
    }

    // Swim holes
    if (d.swim) {
      d.swim.forEach(s => {
        html += `<div class="timeline-item">
          <div class="timeline-left">
            <div class="timeline-dot" style="background:#0c2e3e">🏊</div>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-right" style="background:#0a1e2e;border-color:#1a4a6e">
            <div class="tl-name" style="color:#7dd3fc">${s.name}</div>
            <div class="tl-note">${s.note}</div>
          </div>
        </div>`;
      });
    }

    html += `</div>`; // close timeline
  }

  // Hot spring at camp (non-drive days)
  if (!isDriveDay && d.hotspring) {
    html += `<div class="section-label">♨️ Hot Spring Nearby</div>
    <div class="timeline-right td-spring" style="margin-bottom:10px">
      <div class="tl-name">${d.hotspring.name}</div>
      <div class="tl-note">${d.hotspring.loc} — ${d.hotspring.note}</div>
    </div>`;
  }

  // Camp card
  if (d.camp.name !== 'Home') {
    // Check if tomorrow is a new camp (last night here)
    const nextDay = DAYS[currentDayIdx + 1];
    const isLastNight = nextDay && nextDay.camp && nextDay.camp.name !== d.camp.name && d.camp.checkout && d.camp.checkout !== '—';
    const campIcon = d.camp.type === 'NPS' ? '🏕️' : d.camp.type === 'HipCamp' ? '🦙' : d.camp.type === 'Hotel' || d.camp.type === 'Hotel/Lodge' ? '🏨' : d.camp.type === 'Family' ? '🏡' : d.camp.type === 'Harvest Host' ? '🌾' : '⛺';
    html += `<div class="section-label">Tonight's Stay</div>
    ${isLastNight ? `<div style="background:linear-gradient(135deg,#2a1e08,#3a2a10);border:1px solid #7a5a1a;border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
      <span style="font-size:1.2rem">⏰</span>
      <div>
        <div style="font-size:0.78rem;font-weight:800;color:#f5c842;">Last Night Here</div>
        <div style="font-size:0.74rem;color:#fde8a0;margin-top:2px;">Checkout tomorrow by <strong>${d.camp.checkout}</strong> · Next stop: ${nextDay.camp.name.split(' ')[0]} ${nextDay.camp.name.split(' ')[1] || ''}</div>
      </div>
    </div>` : ''}
    <div class="camp-card">
      <div class="camp-card-header">
        <div class="camp-card-icon">${campIcon}</div>
        <div>
          <div class="camp-card-title">${d.camp.name}</div>
          <div class="camp-card-sub">${d.camp.loc}</div>
        </div>
      </div>
      <div class="camp-rows">
        ${d.camp.site && d.camp.site !== '—' ? `<div class="camp-row"><span class="camp-label">Site</span><span class="camp-value">${d.camp.site}</span></div>` : ''}
        ${d.camp.checkin && d.camp.checkin !== '—' ? `<div class="camp-row"><span class="camp-label">Check-in</span><span class="camp-value">${d.camp.checkin}</span></div>` : ''}
        ${d.camp.checkout && d.camp.checkout !== '—' ? `<div class="camp-row"><span class="camp-label">Check-out</span><span class="camp-value">${d.camp.checkout}</span></div>` : ''}
        ${d.camp.conf && d.camp.conf !== '—' && d.camp.conf !== 'N/A' ? `<div class="camp-row"><span class="camp-label">Confirmation</span><span class="camp-value conf-num">${d.camp.conf}</span></div>` : ''}
        <div class="camp-row"><span class="camp-label">Type</span><span class="camp-value">${d.camp.type}</span></div>
      </div>
    </div>`;
  }

  // Hikes
  if (d.hikes.length > 0) {
    html += `<div class="section-label">🥾 Hikes & Activities</div><div class="hikes-grid">`;
    d.hikes.forEach((h, hi) => {
      const hikeKey = `hike_${d.date}_${hi}`;
      const done = localStorage.getItem(hikeKey) === '1';
      html += `<div class="hike-card${done?' done':''}" onclick="toggleHike('${hikeKey}',this)">
        <div class="hike-card-check"><span class="hike-card-check-icon">✓</span></div>
        <div class="hike-card-body">
          <div class="hike-card-name">${h.name}</div>
          <div class="hike-card-meta">
            ${h.dist && h.dist !== '—' ? `<span class="hike-meta-badge">${h.dist}</span>` : ''}
            ${h.effort && h.effort !== '—' ? `<span class="hike-meta-badge">${h.effort}</span>` : ''}
          </div>
          <div class="hike-card-note">${h.note}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  pane.innerHTML = html;
}

function prevDay() {
  if (currentDayIdx > 0) { currentDayIdx--; renderToday(); }
}
function nextDay() {
  if (currentDayIdx < DAYS.length - 1) { currentDayIdx++; renderToday(); }
}

function renderAllDays() {
  const pane = document.getElementById('pane-days');
  const todayIdx = getTodayIdx();
  const totalMiles = DAYS.reduce((sum,d) => sum + (parseInt(d.miles)||0), 0);
  const pct = todayIdx < 0 ? 0 : Math.min(100, Math.round((todayIdx/28)*100));

  let html = `<div class="trip-progress-strip">
    <div class="tps-label">Trip Progress</div>
    <div class="tps-bar"><div class="tps-fill" style="width:${pct}%"></div></div>
    <div class="tps-stats">
      <div class="tps-stat">Day <span>${todayIdx < 0 ? 0 : todayIdx + 1}</span> of 29</div>
      <div class="tps-stat"><span>~${totalMiles.toLocaleString()}</span> total miles</div>
      <div class="tps-stat">Jun 14 – Jul 12</div>
    </div>
  </div>`;

  DAYS.forEach((d, i) => {
    const isDrive = d.miles !== '0';
    const [grad,textCol,emoji] = getTheme(d);
    const isToday = todayIdx === i;
    const isPast = todayIdx > i && todayIdx >= 0;
    html += `<div class="day-card" onclick="toggleDayCard(${i})" style="${isToday ? 'border-color:#f59e0b;' : ''}">
      <div class="day-card-strip" style="background:${grad}"></div>
      <div class="day-card-header">
        <div class="day-card-left" style="${isPast ? 'opacity:0.6' : ''}">
          <div class="dc-date">${formatDate(d.date)} · Day ${d.day}${isToday ? ' <span style="color:var(--accent);font-weight:800">← TODAY</span>' : ''}</div>
          <div class="dc-dest"><span class="day-card-emoji">${emoji}</span>${d.to.split(',')[0]}${d.nights > 0 ? ` <span style="font-size:0.7rem;color:var(--muted);font-weight:500">· ${d.nights}n</span>` : ''}</div>
          <div class="dc-summary">${d.stops[0] ? '🌟 ' + d.stops[0].name.replace(/⭐/g,'').trim().substring(0,40) : d.hikes[0] ? '🥾 ' + d.hikes[0].name.substring(0,40) : d.label}</div>
        </div>
        <div class="day-card-right">
          ${isDrive ? `<div class="dc-miles">${d.miles} mi</div><div class="dc-time">${d.time}</div>` : `<div class="dc-miles" style="color:var(--muted);font-size:0.75rem">stay</div>`}
        </div>
      </div>
      <div class="day-card-detail" id="dc-${i}">
        ${d.reminders.map(r=>`<div style="background:#2d0a0a;border:1px solid #7f1d1d;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:0.76rem;color:#fca5a5;">⚠️ ${r}</div>`).join('')}
        ${d.fuel.length > 0 ? `<div class="detail-section"><h4>⛽ Fuel Stops</h4>${d.fuel.map(f=>`<div class="detail-row"><span class="icon">⛽</span><div class="txt">${f.name.replace('⚠️ ','')} ${fuelBadge(f.type)}<div class="sub">${f.note}</div></div></div>`).join('')}</div>` : ''}
        ${d.stops.length > 0 ? `<div class="detail-section"><h4>🌟 Scenic Stops</h4>${d.stops.map(s=>`<div class="detail-row"><span class="icon">${s.priority==='top'?'🌟':'📍'}</span><div class="txt">${s.name}<div class="sub">${s.note.substring(0,120)}</div></div></div>`).join('')}</div>` : ''}
        ${d.lunch ? `<div class="detail-section"><h4>🥪 Lunch</h4><div class="detail-row"><span class="icon">🥪</span><div class="txt">${d.lunch.name}<div class="sub">${d.lunch.loc}</div></div></div></div>` : ''}
        ${d.hotspring ? `<div class="detail-section"><h4>♨️ Hot Spring</h4><div class="detail-row"><span class="icon">♨️</span><div class="txt">${d.hotspring.name}<div class="sub">${d.hotspring.note.substring(0,100)}</div></div></div></div>` : ''}
        ${d.hikes.length > 0 ? `<div class="detail-section"><h4>🥾 Hikes</h4>${d.hikes.map(h=>`<div class="detail-row"><span class="icon">🥾</span><div class="txt"><strong>${h.name}</strong>${h.dist&&h.dist!=='—'?' · '+h.dist:''}<div class="sub">${h.note.substring(0,100)}</div></div></div>`).join('')}</div>` : ''}
        <div style="margin-top:10px;background:linear-gradient(135deg,#0c2018,#162c20);border:1px solid #2a5c38;border-radius:10px;padding:10px 12px;">
          <div style="font-size:0.78rem;font-weight:800;color:#86efac;">${d.camp.type==='NPS'?'🏕️':d.camp.type==='HipCamp'?'🦙':d.camp.type==='Hotel'||d.camp.type==='Hotel/Lodge'?'🏨':'⛺'} ${d.camp.name}</div>
          <div style="font-size:0.7rem;color:#4ade80;margin-top:3px;">${d.camp.loc}${d.camp.site&&d.camp.site!=='—'?' · Site '+d.camp.site:''}${d.camp.conf&&d.camp.conf!=='—'&&d.camp.conf!=='N/A'?' · <span style="color:var(--accent);">#'+d.camp.conf+'</span>':''}</div>
        </div>
      </div>
    </div>`;
  });
  pane.innerHTML = html;
}

function toggleDayCard(i) {
  const el = document.getElementById(`dc-${i}`);
  if (el) el.classList.toggle('open');
}

function renderRef() {
  const pane = document.getElementById('pane-ref');
  const states = [...new Set(FUEL_REF.map(f=>f.state))];

  let html = '';

  // Hot springs first
  html += `<div class="ref-section"><h3>♨️ Hot Springs</h3>`;
  HOTSPRING_REF.forEach(h => {
    const closed = h.status === 'CLOSED' || h.status === 'skip';
    html += `<div class="ref-item" style="${closed?'opacity:0.5':''}">
      <div class="ref-name">${closed?'❌ ':'⭐ '}${h.name}</div>
      <div class="ref-addr">${h.loc} · ${h.leg}</div>
      <div class="ref-addr">${h.note}</div>
    </div>`;
  });
  html += '</div>';

  // Fuel by state
  html += `<div class="ref-section"><h3>⛽ Fuel by State</h3>`;
  states.forEach(state => {
    html += `<div style="font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:10px 0 5px;">${state}</div>`;
    FUEL_REF.filter(f=>f.state===state).forEach(f => {
      html += `<div class="ref-item">
        <div class="ref-name">${f.name} ${fuelBadge(f.type)}</div>
        <div class="ref-addr">${f.addr}</div>
        <div class="ref-addr">${f.note}</div>
      </div>`;
    });
  });
  html += '</div>';

  // Groceries
  html += `<div class="ref-section"><h3>🛒 Grocery Stops</h3>`;
  GROCERY_REF.forEach(g => {
    const typeColor = g.type==='Costco'?'pill-blue':g.type==='TJ'?'pill-amber':g.type==='WF'?'pill-green':'pill-purple';
    html += `<div class="ref-item">
      <div class="ref-name">${g.name} <span class="pill ${typeColor}">${g.type==='TJ'?'TJ\'s':g.type==='WF'?'WF':g.type==='Natural'?'🌿 Natural':g.type}</span></div>
      <div class="ref-addr">${g.addr}</div>
      ${g.note ? `<div class="ref-addr">${g.note}</div>` : ''}
    </div>`;
  });
  html += '</div>';

  pane.innerHTML = html;
}

function initMap() {
  if (mapInit) return;
  mapInit = true;

  const map = L.map('map', {zoomControl: true}).setView([44.5, -113.5], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© CARTO', maxZoom: 18
  }).addTo(map);

  // Route
  const routeCoords = DAYS.filter(d=>d.camp.name!=='Home'||d.day===1).map(d=>{
    const camps = {
      'Fairfax, CA':[37.987,-122.589],
      'June Lake, CA':[37.778,-119.059],
      'Doyle, CA':[40.02,-120.10],
      'Butte Lake, Lassen NP':[40.578,-121.282],
      'Mazama Campground, Crater Lake NP, OR':[42.868,-122.144],
      'Terrebonne, OR':[44.365,-121.158],
      'Cheney, WA':[47.490,-117.570],
      'Big Arm, Flathead Lake MT':[47.798,-114.314],
      'Fish Creek Camp, West Glacier':[48.502,-113.988],
      'West Glacier, MT':[48.502,-113.988],
      'Babb, MT (near Many Glacier)':[48.848,-113.432],
      'St. Mary, MT':[48.744,-113.438],
      'Canyon Campground, Yellowstone NP, WY':[44.729,-110.499],
      'Madison Camp':[44.648,-110.862],
      'Grant Village, Yellowstone NP, WY':[44.390,-110.540],
      'Grand Teton NP, WY':[43.908,-110.633],
      'Colter Bay, Grand Teton NP WY':[43.908,-110.633],
      'Teton Village, WY':[43.587,-110.828],
      'Jackson, WY':[43.479,-110.762],
      'Gros Ventre Campground, Jackson WY':[43.503,-110.719],
      'Gros Ventre Camp, Jackson':[43.503,-110.719],
      'Mendoza Ranchette, Jerome ID':[42.724,-114.524],
      'Jerome, ID':[42.724,-114.524],
      'Painted Hills, Mitchell OR':[44.553,-120.152],
      'Back Side of Painted Hills, Mitchell OR':[44.553,-120.152],
      'Yachats, OR':[44.352,-124.091],
      'Corvallis, OR':[44.565,-123.262],
      'Dunsmuir, CA':[41.208,-122.272],
      'Fairfax, CA — HOME':[37.987,-122.589],
    };
    for (const [k,v] of Object.entries(camps)) {
      if (d.to.includes(k.split(',')[0]) || d.to === k) return v;
    }
    return null;
  }).filter(Boolean);

  if (routeCoords.length > 0) {
    L.polyline(routeCoords, {color:'#f59e0b',weight:2,opacity:0.7,dashArray:'6,4'}).addTo(map);
  }

  // Camp pins — one pin per camp, numbered sequentially (not by day number)
  let campNum = 0;
  const seenCamps = new Set();
  DAYS.forEach((d, i) => {
    if (!d.camp || d.miles === '0') return; // only arrival days
    const campKey = d.camp.name + d.camp.loc;
    if (seenCamps.has(campKey)) return; // skip if already pinned
    seenCamps.add(campKey);
    campNum++;
    let lat, lng;
    const locMap = {
      'June Lake, CA':[37.778,-119.059],
      'Doyle, CA':[40.02,-120.10],
      'Lassen Volcanic NP, CA':[40.578,-121.282],
      'Crater Lake NP, OR':[42.868,-122.144],
      'Terrebonne, OR':[44.365,-121.158],
      'Cheney, WA':[47.490,-117.570],
      'Big Arm, Flathead Lake, MT':[47.798,-114.314],
      'West Glacier, MT':[48.502,-113.988],
      'Babb, MT (near Many Glacier)':[48.848,-113.432],
      'St. Mary, MT':[48.744,-113.438],
      'Yellowstone NP, WY':[44.729,-110.499],
      'Madison Campground':[44.648,-110.862],
      'Grant Village, Yellowstone NP, WY':[44.390,-110.540],
      'Grand Teton NP, WY':[43.908,-110.633],
      'Teton Village, WY':[43.587,-110.828],
      'Jackson, WY':[43.479,-110.762],
      'Gros Ventre':[43.503,-110.719],
      'Jerome, ID':[42.724,-114.524],
      'Mitchell, OR':[44.553,-120.152],
      'Yachats, OR':[44.352,-124.091],
      'Corvallis, OR':[44.565,-123.262],
      'Dunsmuir, CA':[41.208,-122.272],
    };
    for (const [k,v] of Object.entries(locMap)) {
      if (d.camp.loc.includes(k.split(',')[0])) { [lat,lng] = v; break; }
    }
    if (!lat) return;

    const icon = L.divIcon({
      className:'',
      html:`<div style="background:#e8782a;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:2px solid rgba(255,255,255,0.8);box-shadow:0 0 8px rgba(232,120,42,0.5)">${campNum}</div>`,
      iconSize:[24,24], iconAnchor:[12,12]
    });
    L.marker([lat,lng],{icon}).addTo(map).bindPopup(`<strong>${d.camp.name}</strong><br>${formatDate(d.date)}<br>${d.miles!=='0'?d.miles+' mi · '+d.time:'Stay day'}`);
  });
}

// ═══════════════════════════════════════════════════════════
// TAB NAVIGATION
// ═══════════════════════════════════════════════════════════
function showTab(tab, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'map') { setTimeout(initMap, 100); }
}

// ═══════════════════════════════════════════════════════════
// HIKE COMPLETION
// ═══════════════════════════════════════════════════════════
function goHome() {
  currentDayIdx = getTodayIdx() >= 0 ? getTodayIdx() : 0;
  renderToday();
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-today').classList.add('active');
  document.querySelector('.nav-btn').classList.add('active');
}

function toggleHike(key, el) {
  const done = localStorage.getItem(key) === '1';
  if (done) {
    localStorage.removeItem(key);
    el.classList.remove('done');
  } else {
    localStorage.setItem(key, '1');
    el.classList.add('done');
  }
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
const todayIdx = getTodayIdx();
currentDayIdx = todayIdx >= 0 ? todayIdx : 0;
renderToday();
renderAllDays();
renderRef();
</script>
